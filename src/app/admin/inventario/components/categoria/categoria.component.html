<div class="card">
    <div class="flex justify-content-between align-items-center mb-4">
        <h5>Categoría</h5>
        <!-- Botón para abrir el diálogo de Nueva Categoría -->
        <button pButton pRipple label="Nueva Categoría" icon="pi pi-plus" class="p-button-success" (click)="openNew()"></button>
    </div>

    <p-table [value]="categorias" [rows]="10" [paginator]="true" [rowHover]="true" dataKey="id">
        <ng-template pTemplate="header">
            <tr>
                <th>ID</th>
                <th>NOMBRE</th>
                <th>DETALLE</th>
                <th>ACCION</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-categoria>
            <tr>
                <td>{{categoria.id}}</td>
                <td>{{categoria.nombre}}</td>
                <td>{{categoria.detalle}}</td>
                <td>
                    <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editCategoria(categoria)"></button>
                    <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" (click)="deleteCategoria(categoria)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<!-- Diálogo modal para registrar o editar una categoría -->
<p-dialog [(visible)]="categoriaDialog" [style]="{width: '450px'}" header="Gestión de Categoría" [modal]="true" class="p-fluid">
    <ng-template pTemplate="content">
        <div class="field">
            <label for="nombre">Nombre</label>
            <input type="text" pInputText id="nombre" [(ngModel)]="categoria.nombre" required autofocus />
        </div>
        <div class="field">
            <label for="detalle">Detalle</label>
            <textarea pInputTextarea id="detalle" [(ngModel)]="categoria.detalle" rows="3" cols="20"></textarea>
        </div>
    </ng-template>
    
    <ng-template pTemplate="footer">
        <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="hideDialog()"></button>
        <button pButton pRipple label="Guardar" icon="pi pi-check" class="p-button-text" (click)="saveCategoria()"></button>
    </ng-template>
</p-dialog>
