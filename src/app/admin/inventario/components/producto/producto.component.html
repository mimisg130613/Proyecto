<div class="card">
    <p-toolbar styleClass="mb-4">
        <ng-template pTemplate="left">
            <button pButton pRipple label="Nuevo Producto" icon="pi pi-plus" class="p-button-success mr-2" (click)="openNew()"></button>
        </ng-template>
    </p-toolbar>

    <p-table #dt [value]="products" [rows]="10" [paginator]="true" [globalFilterFields]="['nombre', 'descripcion']"
        responsiveLayout="scroll" [rowHover]="true" dataKey="id">
        <ng-template pTemplate="caption">
            <div class="flex align-items-center justify-content-between">
                <h5 class="m-0">Gestión de Productos</h5>
                <span class="p-input-icon-left">
                    <i class="pi pi-search"></i>
                    <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')" placeholder="Buscar..." />
                </span>
            </div>
        </ng-template>

        <ng-template pTemplate="header">
            <tr>
                <th>Nombre</th>
                <th>Imagen</th>
                <th>Precio</th>
                <th>Stock</th>
                <th>Categoría</th>
                <th>Acciones</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-product>
            <tr>
                <td>{{ product.nombre }}</td>
                <td>
                    <img *ngIf="product.imagen" [src]="product.imagen" [alt]="product.nombre" width="60" class="shadow-2 border-round" />
                </td>
                <td>{{ product.precio | currency:'USD' }}</td>
                <td>{{ product.stock }}</td>
                <td>{{ product.categoria?.nombre }}</td>
                <td>
                    <button pButton pRipple icon="pi pi-pencil" class="p-button-rounded p-button-success mr-2" (click)="editProduct(product)"></button>
                    <button pButton pRipple icon="pi pi-trash" class="p-button-rounded p-button-warning" (click)="deleteProduct(product)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <!-- Modal Crear / Editar -->
    <p-dialog [(visible)]="visible" [style]="{width: '450px'}" header="Detalles del Producto" [modal]="true" styleClass="p-fluid">
        <ng-template pTemplate="content">
            <form [formGroup]="productoForm">
                <div class="field">
                    <label for="nombre">Nombre</label>
                    <input type="text" pInputText id="nombre" formControlName="nombre" required autofocus />
                </div>

                <div class="field">
                    <label for="descripcion">Descripción</label>
                    <textarea id="descripcion" pInputTextarea formControlName="descripcion" rows="3" cols="20"></textarea>
                </div>

                <div class="field">
                    <label for="categoriaId">Categoría</label>
                    <p-dropdown id="categoriaId" [options]="categorias" formControlName="categoriaId"
                        optionLabel="nombre" optionValue="id" placeholder="Seleccione una categoría" appendTo="body">
                    </p-dropdown>
                </div>

                <div class="formgrid grid">
                    <div class="field col">
                        <label for="precio">Precio</label>
                        <p-inputNumber id="precio" formControlName="precio" mode="currency" currency="USD" locale="en-US"></p-inputNumber>
                    </div>
                    <div class="field col">
                        <label for="stock">Stock</label>
                        <p-inputNumber id="stock" formControlName="stock"></p-inputNumber>
                    </div>
                </div>

                <div class="field">
                    <label for="imagen">Imagen</label>
                    <input type="file" id="imagen" accept="image/*" (change)="onFileSelected($event)" class="w-full" />
                    <div *ngIf="imagenPreview" class="mt-3 text-center">
                        <img [src]="imagenPreview" alt="Vista previa" width="120" class="border-round shadow-2" />
                    </div>
                </div>
            </form>
        </ng-template>

        <ng-template pTemplate="footer">
            <button pButton pRipple label="Cancelar" icon="pi pi-times" class="p-button-text" (click)="visible = false"></button>
            <button pButton pRipple label="Guardar" icon="pi pi-check" class="p-button-text" (click)="guardarProducto()" [disabled]="productoForm.invalid"></button>
        </ng-template>
    </p-dialog>

    <!-- Modal Confirmar Eliminación -->
    <p-dialog [(visible)]="deleteDialog" header="Confirmar" [modal]="true" [style]="{width:'450px'}">
        <div class="flex align-items-center justify-content-center">
            <i class="pi pi-exclamation-triangle mr-3" style="font-size: 2rem"></i>
            <span *ngIf="productoSeleccionado">¿Está seguro de eliminar <b>{{ productoSeleccionado.nombre }}</b>?</span>
        </div>
        <ng-template pTemplate="footer">
            <button pButton pRipple icon="pi pi-times" class="p-button-text" label="No" (click)="deleteDialog = false"></button>
            <button pButton pRipple icon="pi pi-check" class="p-button-text" label="Sí" (click)="confirmarEliminar()"></button>
        </ng-template>
    </p-dialog>
</div>
